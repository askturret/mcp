name: DCO

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # Enforces the sign-off requirement documented in CONTRIBUTING.md.
  dco:
    name: DCO sign-off
    runs-on: [self-hosted, Linux, X64, askturret]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the check walks every commit from the merge-base to
          # the PR head, which a shallow clone cannot resolve.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by on every commit
        run: .github/scripts/dco-check.sh "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # Guards the checker itself, so a change that stops it detecting unsigned
  # commits fails here rather than silently passing every PR.
  dco-self-test:
    name: DCO checker self-test
    # DEPENDABOT: dropped, unlike the `dco` job above (#635).
    #
    # The distinction is which job produces a result anybody acts on. `dco`
    # stays because its RED is the documented conversion signal:
    # CONTRIBUTING.md § "Dependabot pull requests: convert and close" says a
    # bot commit carries no sign-off, so the check "fails by construction" and
    # that failure "is the signal that the pull request needs converting".
    # Skipping it would delete a documented signal to save one checkout.
    #
    # This job asserts nothing about the pull request in front of it — it
    # tests dco-check.sh against its own fixtures, and the answer is identical
    # on every PR. On a dependabot PR that is pure serial-runner time, so it
    # goes. It still runs on every human PR, which is where a change to the
    # checker actually arrives.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, askturret]
    steps:
      - uses: actions/checkout@v4
      - name: Run dco-check.sh test suite
        run: .github/scripts/dco-check.test.sh
