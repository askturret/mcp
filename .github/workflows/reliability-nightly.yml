# Reliability tier at load (#51).
#
# Separate from test.yml on purpose. §51 asks for load and chaos on merge
# rather than on every pull request because they are slow, and puts the full
# figures on a nightly job — a suite that made every PR wait ten minutes is
# one that gets skipped, which costs more coverage than it buys.
#
# The PR job runs the same scenarios at PR scale, so the SHAPE of every
# assertion is verified on each change; this run carries the load figures.
name: Reliability (nightly)

on:
  schedule:
    # 03:00 UTC — after the day's merges have landed, before the next morning.
    - cron: '0 3 * * *'
  push:
    branches: [main]
    paths:
      - 'packages/reliability/**'
      - 'packages/core/**'
      - 'packages/transports/**'
  workflow_dispatch:
    inputs:
      scale:
        description: 'nightly (full) or pr (scaled)'
        required: false
        default: 'nightly'

jobs:
  reliability:
    runs-on: [self-hosted, Linux, X64, askturret]
    # Generous, but bounded: a hung scenario must fail the job rather than
    # occupy a runner until the platform's own limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # sources-openapi is required by the reference-Petstore layer, and must
      # come after core, which it depends on: `npm run build -w` builds in the
      # order given rather than in dependency order.
      - run: npm run build -w packages/core -w packages/sources-openapi -w packages/transports -w packages/reliability

      # --expose-gc is what makes the heap assertion real. Without it the
      # suite REPORTS heap growth and declines to assert on it, because
      # heapUsed moves with GC scheduling and a memory check that fires on
      # timing is one that gets disabled.
      - name: Run reliability suite at load
        env:
          RELIABILITY_SCALE: ${{ github.event.inputs.scale || 'nightly' }}
        run: node --expose-gc packages/reliability/bin/run.mjs

      # Evidence, not just pass/fail. A regression that is still inside its
      # threshold is invisible to a green check, and that is exactly how a
      # slow degradation ships.
      - name: Capture evidence
        if: always()
        env:
          RELIABILITY_SCALE: ${{ github.event.inputs.scale || 'nightly' }}
        run: node --expose-gc packages/reliability/bin/run.mjs --json > reliability-evidence.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reliability-evidence
          path: reliability-evidence.json
          retention-days: 30

  # THE INTEGRATED TREE (#687 change 3) — the compensating control for dropping
  # `push: main` from test.yml.
  #
  # WHAT WAS DROPPED, and why it was not a duplicate. test.yml ran a second full
  # matrix on every merge. The issue framed that as re-proving the tree the pull
  # request had just proved; the Architect corrected it, and the correction is
  # why this job exists. A pre-merge run proves THE PR'S TREE. The squashed
  # commit is that PR merged into whatever `main` had become BY MERGE TIME — and
  # main moves constantly, measured at eleven merges in four minutes. So the
  # post-merge run proved THE INTEGRATED TREE, which no pull-request run ever
  # saw, and the failure it caught is the semantic conflict: two changes each
  # green alone, broken together. This repository has no required status checks
  # (#647), so nothing else catches it and nothing requires a branch be up to
  # date before merging.
  #
  # THE EXPOSURE THIS BUYS, stated as a cost rather than buried: up to ~24 hours
  # between a bad integration landing and this run catching it. During that
  # window the symptom is the NEXT pull request's CI going red for reasons that
  # are not its own, which costs diagnosis time and is itself a throughput tax.
  # Judged acceptable against roughly half the queue — but it is real.
  #
  # IT MUST NOT REUSE test.yml's `changes` JOB, and this is the trap the whole
  # design turns on. That job is a paths-filter over a pull request's diff; on a
  # schedule there is no diff, so it trips no filter, schedules ZERO suites, and
  # the run REPORTS GREEN HAVING RUN NOTHING. A constant wearing a verdict —
  # ADR-024, arriving in the one place with no second observer. The runner below
  # has no filter in reach at all, by construction rather than by discipline,
  # and its self-test asserts that structurally against its own source.
  #
  # EXIT 2 IS EXPECTED AND CORRECT when a suite could not be RUN, and it
  # outranks a genuine failure. Do not convert it to a pass. This is the sole
  # proof for the integrated tree, so "could not check" resolving as "passed" is
  # the worst outcome available here (#281/#535).
  #
  # It rides this workflow rather than adding a sixth file for the same reason
  # the two jobs below do: the 03:00 UTC schedule already exists, and its own
  # comment describes that moment as "after the day's merges have landed" —
  # precisely the population this verifies. It is a separate job because it
  # shares nothing with the reliability suite but the cron.
  integrated-tree:
    # SCHEDULE AND MANUAL ONLY — NOT `push`. This workflow also triggers on
    # pushes to main touching reliability/core/transports, and without this
    # condition those merges would each schedule twelve suites: the post-merge
    # full run this change exists to remove, reintroduced through a side door on
    # the three most frequently-touched packages in the repository.
    #
    # `workflow_dispatch` is kept deliberately rather than narrowed to
    # `schedule`. The claim this job makes — twelve suites, no diff, no filter
    # consulted — is one a reviewer should be able to OBSERVE on demand instead
    # of waiting for 03:00 UTC and taking it on faith.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, askturret]
    # Twelve suites on one serial runner. Generous, but bounded: a hung suite
    # must fail the job rather than hold the pool until the platform's limit.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # FIRST, and unconditional. Everything below can fail, and a nightly read
      # the next morning by someone who merged none of the day's commits needs
      # to know WHICH tree was under test before it reads why it broke.
      #
      # BLOCK SCALAR, and it is load-bearing rather than style. As a plain
      # scalar this line contained `: ` (colon-space), which YAML reads as the
      # start of a nested mapping — so the file did not parse, and GitHub does
      # not load a workflow it cannot parse AT ALL. That would have taken this
      # job AND the pre-existing `reliability` job in this same file down
      # silently, while test.yml had already lost `push: main`: the integrated
      # tree left with no assertion over it and nothing saying so.
      - name: Name the tree under test
        run: |
          echo "Integrated tree under test: $GITHUB_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      # The root build is `tsc -b`, which walks the whole project graph — so
      # unlike test.yml's per-suite `npm run build -w <list>`, there is no build
      # ORDER to get wrong here and no per-package list to keep in step.
      - run: npm run build

      - name: Every package suite, against main's tip
        run: node .github/scripts/nightly-integrated-tree.mjs .

  # PART B of #535 — divergence detection for prose asserting platform state.
  #
  # WHY IT LIVES ON A SCHEDULE AND NOT IN test.yml. It makes a live GitHub API
  # call, and a networked check in the PR path has no good failure mode:
  # cannot-read -> fail reddens every PR during an API outage, a red nobody can
  # clear; cannot-read -> pass is "could not check" resolving as "it passed",
  # the #281 violation the guard exists to prevent. tag-readiness-advisory.yml
  # already ruled on this shape — a red X on something nothing actually refused
  # is "an overclaim in the other direction". Here an outage delays detection by
  # a day and blocks nobody.
  #
  # EXIT 2 IS EXPECTED AND CORRECT when live state cannot be read. It reddens
  # this nightly job and gates nothing. Do not convert it to a pass, and do not
  # move this step into the PR path to "make it consistent" — see #535.
  #
  # It rides this workflow rather than adding a sixth file because the schedule
  # already exists. The job shares nothing with the reliability suite but the
  # cron, which is why it is a separate job rather than a step in that one.
  platform-claims:
    runs-on: [self-hosted, Linux, X64, askturret]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci`: the guard uses Node builtins and `fetch` only, so it needs
      # no install to be trustworthy — the same reasoning the other guards give.
      - name: Declared platform claims still match live state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/check-platform-claims.mjs . --live

  # #599 — GitHub Releases reconciled against the npm registry.
  #
  # A Release existing has never been evidence that npm has the package, and
  # nothing compared the two. That gap cost ~19 hours of a priority:critical
  # issue describing a condition already resolved for 18 of them: the failure
  # was invisible, the RECOVERY was invisible, and the only detector in either
  # direction was a person deciding to look.
  #
  # WHY THIS IS NOT A JOB ON THE RELEASE PATH, so nobody rebuilds one. A
  # `verify-published` job with `needs: [publish]` is SKIPPED when `publish`
  # fails — it goes quiet in exactly the case it exists for. And the manual
  # publish that repaired the incident happened AFTER an already-red run, off
  # the release path entirely, where no event would have observed it. An
  # observer on a SCHEDULE reading the REGISTRY sees both; a gate on an EVENT
  # reading the WORKFLOW sees neither.
  #
  # EXIT 2 IS EXPECTED AND CORRECT when the registry or the API cannot be read.
  # It reddens this nightly job and gates nothing (#535/#281). Do not convert it
  # to a pass, and do not move it into the PR path — same ruling as the job
  # above, for the same reason.
  #
  # It rides this workflow for the same reason platform-claims does: the
  # schedule already exists, and a networked observer needs nothing else.
  release-registry-reconcile:
    runs-on: [self-hosted, Linux, X64, askturret]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci` — Node builtins and `fetch` only.
      - name: GitHub Releases and the npm registry still agree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/check-release-registry-reconcile.mjs . --live
