name: Supply chain

# Licence review runs on every PR (issue #24 acceptance criterion).
# SBOM generation is dry-runnable on demand and on release, so it can be proven
# to work before a release is ever cut.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Licence review and SBOM share a checkout and an `npm ci`, so they run
  # as one job rather than two. That is not only faster: this repository's Test
  # workflow already schedules 17 jobs per PR, and jobs were being failed at
  # "Set up job" with no runner assigned once the account ran out of concurrent
  # capacity. Two runner slots for one install is a cost worth not paying.
  supply-chain:
    name: Licence review and SBOM
    runs-on: [self-hosted, Linux, X64, askturret]
    permissions:
      # `gh release upload` below needs contents: write. The workflow-level
      # default is contents: read, which this job inherited — so the upload
      # would have failed with a 403 on the first real release (#269). It was
      # fixed before any release exercised it, so the 403 was reasoned about
      # rather than observed — the SBOM upload has since run green on a real
      # release. `publish` already declares its own block for id-token: write;
      # this job was simply missed.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      # Runs FIRST because every check below it reads the same inventory: the
      # licence gate, the NOTICE generator and the SBOM scope tagger all call
      # `inventory()`. What it pins is the cannot-check discipline — an
      # `npm ls` that never STARTS must report that the dependency set is
      # unknown, never an empty one. An empty runtime set marks every package
      # `development`, and the NOTICE generator then rewrites the file to say
      # the product bundles nothing third-party and exits 0 (#464).
      - name: Self-test the dependency inventory
        run: node .github/scripts/lib/dependencies.test.mjs

      # The policy evaluator decides what ships, so verify it before trusting
      # its verdict on the real tree.
      - name: Self-test the licence policy
        run: node .github/scripts/check-licenses.test.mjs

      # Fails on GPL/AGPL/SSPL/LGPL/source-available/undeclared licences without
      # an approved exception in LICENSE_EXCEPTIONS.md.
      - name: Review dependency licences
        run: node .github/scripts/check-licenses.mjs

      # #431/#456: self-tested first. In --check mode this IS a guard, and what
      # it guards is a licence obligation — a silent failure here does not break
      # a build, it ships a compliance problem. Its cannot-check path (the
      # inventory could not be built) must never render as "up to date".
      - name: Self-test the NOTICE generator
        run: node .github/scripts/generate-notice.test.mjs

      # Attribution is a licence obligation, so a stale NOTICE is a build
      # failure rather than a tidiness warning.
      - name: Check NOTICE is current
        run: node .github/scripts/generate-notice.mjs --check

      # Self-tested first, like the guards above. What it pins is the
      # cannot-check branch (#443): a generator that never STARTS must say so,
      # rather than report `SBOM generation failed (exit null)` and name an exit
      # that never happened. An unwitnessed cannot-check branch is how an
      # incomplete copy survives review — the causal claim #443 is built on.
      - name: Self-test the SBOM generator
        run: node .github/scripts/generate-sbom.test.mjs

      # Proves SBOM generation works without needing a release to exist.
      - name: Generate CycloneDX SBOM
        # pipefail matters here: GitHub Actions runs `bash -e` without it, so
        # piping into tee would take tee's exit code and a failed generation
        # would pass silently — the exact failure this repo keeps hitting (#79).
        run: |
          set -o pipefail
          node .github/scripts/generate-sbom.mjs --output sbom.cdx.json | tee sbom-summary.txt

      # Put the inventory counts in the job summary, so a reviewer can see what
      # the SBOM contains without downloading anything.
      - name: Summarise SBOM
        run: |
          {
            echo '### CycloneDX SBOM'
            echo ''
            echo '```'
            cat sbom-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deliberately NOT uploaded on pull requests. Generation is what a PR
      # needs to prove, and keeping a throwaway copy per PR run is what
      # exhausted the account's artifact storage quota. Releases get the durable
      # copy as a release asset below, which does not consume that quota.
      - name: Upload SBOM artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      # Attach to the GitHub release when this run was triggered by one.
      - name: Attach SBOM to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json --clobber

  # The readiness matrix, evaluated for the release event itself (#269).
  #
  # This is the RELEASE-time gate. test.yml runs the same script at commit
  # time, but it triggers on pull_request and push only — so before this job
  # existed, publishing a Release fired an automated npm publish with the
  # matrix never evaluated for that event at all.
  #
  # Note what this does NOT do: it does not block the tag. Actions runs after
  # a ref exists, so no workflow can refuse a tag — it can only fail a run
  # afterwards. Publication is the act worth gating, and `publish` depends on
  # this job below. docs/releasing.md states the distinction.
  readiness:
    name: Readiness matrix
    if: github.event_name == 'release'
    runs-on: [self-hosted, Linux, X64, askturret]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No `npm ci`: the script and its self-test use only Node builtins, so
      # this job needs no install to be trustworthy.
      - name: Self-test the readiness matrix gate
        run: node .github/scripts/check-readiness-matrix.test.mjs

      - name: Evaluate the readiness matrix
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # readiness.md certifies 1.0 readiness, and compatibility-policy.md is
          # explicit that 0.x "carries no compatibility guarantee at all" — so
          # the matrix BLOCKS from 1.0.0 onwards and is ADVISORY below it.
          #
          # An unparseable tag yields a major that is not "0" and therefore
          # blocks. That is the safe direction: a release whose version cannot
          # be read is not one to publish on an unchecked matrix.
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          if [ "$MAJOR" = "0" ]; then
            echo "Release $TAG is 0.x — readiness matrix is advisory."
            node .github/scripts/check-readiness-matrix.mjs --advisory
          else
            echo "Release $TAG is >= 1.0.0 — readiness matrix is blocking."
            node .github/scripts/check-readiness-matrix.mjs
          fi

  # Publishes with npm provenance, linking the tarball to this workflow run.
  # Release-triggered only: it must never run on a PR.
  publish:
    name: Publish with provenance
    if: github.event_name == 'release'
    # `readiness` is the one-word gate (#269): a 1.0.* release with a red
    # matrix fails that job, so this one never runs. A 0.x release passes it
    # advisorily and publishes, saying so in the job summary.
    needs: [supply-chain, readiness]
    # THE ONE GITHUB-HOSTED JOB IN THIS REPOSITORY (#595). Every other job runs
    # on the self-hosted pool, enforced by .github/scripts/check-runners.mjs,
    # because a hosted job is refused at "Set up job" with an empty log once the
    # Actions budget is exhausted (#111/#280).
    #
    # This job is the exception because npm refuses `--provenance` on a
    # self-hosted runner OUTRIGHT. Observed on run 33784073765, not inferred:
    #
    #   npm error 422 Unprocessable Entity
    #     Error verifying sigstore provenance bundle: Unsupported GitHub Actions
    #     runner environment: "self-hosted". Only "github-hosted" runners are
    #     supported when publishing with provenance.
    #
    # So `--provenance` and `runs-on: [self-hosted, ...]` are mutually
    # exclusive: with both, no release publishes through CI at all — not
    # partially, and not without an attestation.
    #
    # The cost is bounded by the `if:` above — RELEASE EVENTS ONLY, so this is
    # minutes per release rather than the 17-jobs-per-PR load that drove #280 to
    # self-hosting in the first place.
    #
    # The guard permits this through a NARROW carve-out keyed on
    # `supply-chain.yml::publish`. If another job ever needs a hosted runner, add
    # another named entry — do NOT put a hosted label in APPROVED_LABELS. That
    # would not on its own let anything run hosted, since REQUIRED_LABEL still
    # demands `self-hosted`; it removes one of two locks for every job in the
    # repository, leaving REQUIRED_LABEL as the only thing holding the line.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance — it is what lets npm attest that this
      # tarball came from this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build

      # --provenance requires id-token: write above and a registry that accepts
      # attestations. Publishing is gated behind licence review and SBOM
      # generation by `needs:`, so a release cannot skip them.
      - name: Publish
        run: npm publish --workspaces --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
