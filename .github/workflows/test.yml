name: Test

# PULL REQUESTS ONLY. THE `push: main` TRIGGER WAS DROPPED (#687 change 3).
#
# It fired a second full run of this workflow on every merge — measured at
# eleven merges between 11:00 and 11:04 on 2026-09-05, each adding a `Test` run
# to a strictly serial single runner, two of them still queued 47 minutes later
# and sitting in front of live PR work.
#
# WHAT THAT RUN UNIQUELY PROVED, because it was NOT merely a repeat. A
# pre-merge run proves THE PR'S TREE. The squashed commit is that PR merged
# into whatever `main` had become by merge time, and main moves constantly — so
# the post-merge run proved THE INTEGRATED TREE, which no PR run ever saw. The
# failure it caught is the semantic conflict: two PRs each green alone, broken
# together. Nothing else here catches that, because this repository has no
# required status checks (#647) and therefore no up-to-date-before-merge
# requirement.
#
# SO IT WAS NOT DROPPED BARE. `reliability-nightly.yml`'s `integrated-tree` job
# is the compensating control: it runs every package suite against main's tip
# at 03:00 UTC, unconditionally and with no path filter in reach of it. The
# exposure bought is up to ~24h between a bad integration landing and the
# nightly catching it. DO NOT re-add `push: main` here without removing that
# job — two mechanisms proving the same tree is the cost this change removed.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# SUPERSEDED PR RUNS ARE CANCELLED. NOTHING ELSE EVER IS. (#687)
#
# A force-push during review used to leave the previous run executing to
# completion against a commit nobody would ever merge. On one serial
# self-hosted runner that run is not merely wasted — it sits in front of live
# work, so the most actively-revised PR waits longest.
#
# EVERY RUN REACHING THIS BLOCK IS A PR RUN, since the trigger above is now
# `pull_request` alone. The `github.run_id` fallback is therefore unexercised
# in THIS file today — and it stays, for two reasons that are not style.
#
# First, supply-chain.yml:20 points HERE for the reasoning behind a key it
# declares identically, and that workflow still runs on `push` and on
# `release: published`. Deleting the explanation would leave the copy that
# needs it pointing at nothing.
#
# Second, it is what makes adding a trigger back safe. `github.run_id` is
# unique per run, so every non-PR run becomes a group of one and can never be
# cancelled by anything — covering `schedule`, `push`, `release` and
# `workflow_dispatch` WITHOUT enumerating event names. An enumeration would
# need updating the next time a trigger is added, and would fail silently when
# it wasn't.
#
# DO NOT COPY THE KEY FROM lane-check.yml. That one is a bare
# `pull_request.number` with an unconditional `cancel-in-progress`. It is
# correct THERE because lane-check is PR-only — as this workflow now is too,
# which is exactly what makes the shortcut tempting here. It would stop being
# correct the moment a non-PR trigger returns: `pull_request.number` is EMPTY
# for one, so every such run would drop into a single shared group and cancel
# the others.
#
# `cancel-in-progress` accepts `${{ }}` and evaluates per run. It is redundant
# with the group key by design — belt-and-braces, and cheap.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Path filter job - detects which packages changed
  changes:
    # DEPENDABOT: KEEP THE PULL REQUEST, DROP THE COMPUTE (#635).
    #
    # A dependabot pull request is never a merge candidate — CONTRIBUTING.md
    # § "Dependabot pull requests: convert and close" retires it as a
    # hand-carried issue. Running the package suites on the single serial
    # runner therefore spends the scarcest resource in this project on a
    # verdict nobody will act on.
    #
    # This skips the COMPUTE only. Nothing here suppresses the pull request
    # itself, which is the notification the conversion depends on, and no
    # `.github/dependabot.yml` exists to change that.
    #
    # KEYED ON AUTHORSHIP, NOT BRANCH NAME. `dependabot/**` branch names are
    # forgeable by anyone with push access and they drift with dependabot's
    # own conventions; `pull_request.user.login` is the forge's own statement
    # of who opened it. Note this reads the PR AUTHOR rather than
    # `github.actor` deliberately: a human pushing a fixup to a dependabot
    # branch changes the actor while the authorship — and so the
    # convert-and-close disposition — is unchanged.
    #
    # The `github.event_name` guard keeps `push` to main unaffected, so the
    # post-merge run is never skipped by this.
    #
    # THE EVIDENCE IS DEFERRED, NOT LOST: the hand-carried branch runs the
    # same suites, so a GPL transitive or a stale NOTICE surfaces there
    # instead (#585 is the live example).
    #
    # The 12 package jobs below need this one and gate on its outputs, so
    # they skip with it and carry no condition of their own — one gate, not
    # thirteen. `coverage-status` and `test-integrity` DO carry it: the first
    # is `if: always()` and the second needs nothing, so neither inherits the
    # skip.
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, askturret]
    outputs:
      core: ${{ steps.filter.outputs.core }}
      adapters-express: ${{ steps.filter.outputs.adapters-express }}
      adapters-fastify: ${{ steps.filter.outputs.adapters-fastify }}
      adapter-conformance: ${{ steps.filter.outputs.adapter-conformance }}
      sources-openapi: ${{ steps.filter.outputs.sources-openapi }}
      transports: ${{ steps.filter.outputs.transports }}
      observability: ${{ steps.filter.outputs.observability }}
      explorer: ${{ steps.filter.outputs.explorer }}
      cli: ${{ steps.filter.outputs.cli }}
      reliability: ${{ steps.filter.outputs.reliability }}
      adapter-test: ${{ steps.filter.outputs.adapter-test }}
      gateway: ${{ steps.filter.outputs.gateway }}
      workspace: ${{ steps.filter.outputs.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'packages/core/**'
            adapters-express:
              - 'packages/adapters-express/**'
              # adapters-express serves the Explorer, so an explorer-only
              # change must re-run these tests too.
              - 'packages/explorer/**'
              # petstore-example.test.ts compiles the example's REAL spec, so a
              # change to the example must re-run these tests — otherwise the
              # guard cannot fire on the thing it guards (#99).
              - 'examples/petstore-light/**'
              # The adapter is BUILT from core and transports and has no runtime
              # of its own for the parts they own, so a change to either can
              # break it without touching an adapter file (#153). This was a
              # near-miss on #43: a real bulkhead bug reached CI and was caught
              # only because #42's adapter-conformance filter happens to include
              # these two. That is coverage by side effect — it would disappear
              # the day that filter is narrowed.
              - 'packages/core/**'
              - 'packages/transports/**'
              # Also built from the OpenAPI source (#213) — declared in
              # package.json, so a change there can break this adapter without
              # touching a file the other entries match.
              - 'packages/sources-openapi/**'
            adapters-fastify:
              - 'packages/adapters-fastify/**'
              # Same reasoning as adapters-express: this adapter serves the
              # Explorer too, so an explorer-only change must re-run it.
              - 'packages/explorer/**'
              # And the same dependency reality (#153) — built from core and
              # transports, so both must re-run it.
              - 'packages/core/**'
              - 'packages/transports/**'
              # Same OpenAPI-source dependency as adapters-express (#213).
              - 'packages/sources-openapi/**'
            adapter-conformance:
              # The conformance suite asserts PARITY, so it must re-run when any
              # adapter changes, and when the shared machinery underneath them
              # does. Narrowing this to its own directory would let an adapter
              # or transport change break parity without the suite noticing.
              - 'packages/adapter-conformance/**'
              - 'packages/adapters-express/**'
              - 'packages/adapters-fastify/**'
              - 'packages/core/**'
              - 'packages/transports/**'
              # The suite drives the adapters through a real OpenAPI source, so
              # a change there can break parity with no adapter file touched (#213).
              - 'packages/sources-openapi/**'
              # Both adapters serve the Explorer, so parity depends on it even
              # though adapter-conformance never names it (#282). "The shared
              # machinery underneath them", above, is transitive — this is the
              # entry that makes the comment true.
              - 'packages/explorer/**'
            gateway:
              - 'packages/gateway/**'
              # The gateway is assembled ENTIRELY from these packages and adds
              # no runtime of its own, so a change to any of them can break it
              # without touching a gateway file. Its own suite is also what
              # covers the compose example's config and spec, so those count
              # too — an example that stops working is a shipped defect.
              - 'packages/core/**'
              - 'packages/transports/**'
              - 'packages/sources-openapi/**'
              - 'packages/observability/**'
              - 'examples/gateway-compose/**'
            reliability:
              # The suite asserts on INTERACTIONS between the resilience
              # primitives, so it must re-run when any of them changes — not
              # merely when its own directory does. Narrowing this to
              # packages/reliability/** would let a bulkhead or breaker change
              # silently alter a seam the suite exists to guard.
              - 'packages/reliability/**'
              - 'packages/core/**'
              - 'packages/transports/**'
              # The reference-Petstore layer compiles this spec through the
              # OpenAPI source, so a change to either can break the suite
              # without touching anything above it.
              - 'packages/sources-openapi/**'
              - 'examples/petstore-light/**'
            adapter-test:
              # The kit RUNS the real adapters through the real bank, so it
              # must re-run when any of them changes — not merely when its own
              # directory does. Narrowing this to packages/adapter-test/**
              # would let an adapter or bank change alter a published
              # conformance result with nothing noticing.
              - 'packages/adapter-test/**'
              - 'packages/adapter-conformance/**'
              - 'packages/adapters-express/**'
              - 'packages/adapters-fastify/**'
              - 'packages/core/**'
              - 'packages/transports/**'
              # Reached through adapter-conformance, which the kit runs (#282).
              # A published conformance result depends on both, and neither
              # appears in this package's own manifest — which is exactly why
              # the guard now walks the closure rather than direct deps.
              - 'packages/sources-openapi/**'
              - 'packages/explorer/**'
            # The five filters below each declare a dependency on core and, until
            # #213, listed only their own directory — so a core change did not
            # re-run any of them. check-path-filters.mjs now asserts this from
            # each package.json, which is why the entries are no longer a matter
            # of remembering.
            sources-openapi:
              - 'packages/sources-openapi/**'
              - 'packages/core/**'
            transports:
              - 'packages/transports/**'
              - 'packages/core/**'
            observability:
              - 'packages/observability/**'
              - 'packages/core/**'
            explorer:
              - 'packages/explorer/**'
              - 'packages/core/**'
            cli:
              - 'packages/cli/**'
              - 'packages/core/**'
            # A CHANGE TO THE FILE THAT DEFINES THE SUITES RE-RUNS THEM.
            # A CHANGE TO ANY OTHER WORKFLOW FILE DOES NOT. (#687)
            #
            # This was '.github/workflows/**', which meant a one-line edit to
            # dco.yml scheduled all twelve package suites on the single serial
            # runner. Observed on PR #672: four workflow files, changing only
            # which jobs run on dependabot PRs — nothing that could alter any
            # package's behaviour — and twelve suites ran.
            #
            # test.yml is kept because everything that CAN change package-suite
            # behaviour lives in it: the suites themselves, their `if:` gates,
            # this `changes` job, the Node version and the build commands. A
            # guard newly wired into test.yml still trips this and still gets
            # its full-matrix run, which is correct (PR #685 was legitimate).
            #
            # DELIBERATELY NOT SPLIT INTO A SECOND FILTER. A `ci-wiring` filter
            # for the remaining workflow files would fail check A in
            # check-path-filters.mjs, which rejects any filter name that is not
            # a `packages/<dir>` and exempts `workspace` BY LITERAL NAME
            # (:535-536). Adding one means widening that exemption in the same
            # change. Narrowing alone gets the win, so narrowing is all this is.
            workspace:
              - 'package.json'
              - 'tsconfig.json'
              - '.github/workflows/test.yml'

  # Test core package
  test-core:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core
      - run: npm test --workspace=packages/core

  # Test adapters-express package
  test-adapters-express:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.adapters-express == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/sources-openapi -w packages/transports -w packages/explorer -w packages/adapters-express
      - run: npm test --workspace=packages/adapters-express

  # Test adapters-fastify package
  test-adapters-fastify:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.adapters-fastify == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/sources-openapi -w packages/transports -w packages/explorer -w packages/adapters-fastify
      - run: npm test --workspace=packages/adapters-fastify

  # Adapter conformance contract - runs the shared bank against every adapter
  test-adapter-conformance:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.adapter-conformance == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/sources-openapi -w packages/transports -w packages/explorer -w packages/adapters-express -w packages/adapters-fastify -w packages/adapter-conformance
      # Prints the side-by-side parity table (§42 Acceptance).
      - run: npm run test:conformance

  # The community conformance kit (#54). Separate from test-adapter-conformance:
  # that job proves the in-repo adapters agree with each other, this one proves
  # the PUBLIC kit reaches the same verdict through the public AdapterUnderTest
  # shape a community author uses.
  test-adapter-test:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.adapter-test == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # Order matters: `npm run build -w` builds in the order given, not in
      # dependency order.
      - run: npm run build -w packages/core -w packages/sources-openapi -w packages/transports -w packages/explorer -w packages/adapters-express -w packages/adapters-fastify -w packages/adapter-conformance -w packages/adapter-test
      - run: npm test --workspace=packages/adapter-test

  # Test sources-openapi package
  test-sources-openapi:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.sources-openapi == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/sources-openapi
      - run: npm test --workspace=packages/sources-openapi

  # Test transports package
  test-transports:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.transports == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/transports
      - run: npm test --workspace=packages/transports

  # Test observability package
  test-observability:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.observability == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/observability
      - run: npm test --workspace=packages/observability

  # Test explorer package
  test-explorer:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.explorer == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/explorer
      - run: npm test --workspace=packages/explorer

  # Test standalone gateway package (#57)
  test-gateway:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.gateway == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # The gateway's tests import its siblings through their BUILT dist, so an
      # unbuilt dependency here fails as a module-resolution error rather than
      # as the behaviour under test.
      - run: npm run build -w packages/core -w packages/sources-openapi -w packages/transports -w packages/observability -w packages/gateway
      - run: npm test --workspace=packages/gateway

  # Test CLI package
  test-cli:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build -w packages/core -w packages/cli
      - run: npm test --workspace=packages/cli

  # Reliability tier — load, chaos, shutdown/reload (#51)
  #
  # Runs at PR SCALE here. §51 asks for load and chaos on merge rather than on
  # every PR because they are slow; the scaled run keeps the SHAPE of every
  # scenario verified on each change, and the nightly workflow carries the
  # load figures.
  test-reliability:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs: changes
    if: needs.changes.outputs.reliability == 'true' || needs.changes.outputs.workspace == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      # sources-openapi is built here because the reference-Petstore layer
      # compiles a real spec through it. Order matters: it depends on core, and
      # `npm run build -w` runs these in the order given, not in dependency
      # order. A local `tsc -b` builds the whole project graph and so cannot
      # catch a missing entry here — this job is the only thing that can.
      - run: npm run build -w packages/core -w packages/sources-openapi -w packages/transports -w packages/reliability
      - run: npm test --workspace=packages/reliability

  # One job normalises path-filtered skip/pass/fail into the single signal the
  # merge-coverage gate reads. It replaces the 13 per-package `*-status` wrapper
  # jobs that used to live here (#110) — each burned a full runner slot to echo a
  # string, and together they were half of the 27 jobs a PR scheduled.
  #
  # The rule is UNCHANGED, and `ci-coverage-status.test.mjs` asserts it against
  # the old wrapper rule combination by combination:
  #
  #   implicated = this package changed, or the change is workspace-wide
  #   implicated     -> that package's test job MUST have concluded 'success'
  #   not implicated -> satisfied; the job will have skipped
  #
  # This is also why a green signal alongside a skipped `test-core` is correct on
  # a cli-only PR: core is not implicated, so there is nothing to have tested.
  #
  # `needs` below is the source of truth for what gets checked — the script
  # derives each package from the `test-<key>` job names it is handed, so adding
  # a test job here is all that is needed to have it covered. Keeping 13
  # hand-written wrappers in sync by hand was the alternative.
  #
  # One behaviour deliberately changed: the old wrappers reported SUCCESS when the
  # `changes` job failed. Empty filter outputs made every package look "not
  # implicated", so all 13 went green having tested nothing — a false pass in
  # exactly the runner-capacity shape (2026-08-21) that motivated this issue. The
  # script refuses instead; see its header for the reasoning.
  coverage-status:
    runs-on: [self-hosted, Linux, X64, askturret]
    needs:
      - changes
      - test-core
      - test-adapters-express
      - test-adapters-fastify
      - test-adapter-conformance
      - test-adapter-test
      - test-sources-openapi
      - test-transports
      - test-observability
      - test-explorer
      - test-gateway
      - test-cli
      - test-reliability
    # `always()` means this does NOT inherit the skip when `changes` is
    # skipped, so the dependabot condition is repeated here (#635). Both
    # clauses are load-bearing: drop `always()` and a failing suite stops the
    # coverage signal being reported at all.
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalise per-package coverage into one signal
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-coverage-status.mjs

  # #79: tests that never run, or that cannot fail, report coverage that does
  # not exist. Eight instances were caught by hand in QA before this job; it
  # runs on every PR regardless of which paths changed, because test integrity
  # is not scoped to a package.
  test-integrity:
    # Needs nothing, so it does not inherit `changes`'s skip (#635).
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: [self-hosted, Linux, X64, askturret]
    steps:
      - uses: actions/checkout@v4
        with:
          # The append-only audit guard (#128) diffs against the PR's base, so
          # the base ref has to be present. The default shallow checkout does
          # not have it, and the guard would exit 2 ("could not check") rather
          # than silently passing — correct, but useless. Full history is what
          # lets it actually answer.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      # Guards first: if the checkers themselves are broken, the results below
      # are meaningless.
      - name: Self-test the guards
        run: node .github/scripts/check-guards.test.mjs

      # #128: the union merge driver and the append-only guard, tested together
      # against a REAL git merge — including the control case that proves the
      # clean merge is caused by .gitattributes rather than coincident with it.
      - name: Self-test the audit append-only guard
        run: node .github/scripts/check-audit-append-only.test.mjs

      # #58: a CODEOWNERS rule that matches nothing routes nothing, and GitHub
      # reports neither — the area looks owned and is not. Also fails when a new
      # package has no rule of its own, so adding one forces an ownership
      # decision instead of letting it fall silently to the catch-all.
      - name: Self-test the CODEOWNERS guard
        run: node .github/scripts/check-codeowners.test.mjs

      - name: CODEOWNERS routes what it claims to
        run: node .github/scripts/check-codeowners.mjs

      # #213: the per-package path filters decide which suites run at all, so a
      # filter missing a dependency produces a GREEN pull request in which the
      # packages affected by the change were never scheduled — the #110/#121
      # family again. Five filters were missing core and three were missing
      # sources-openapi when this was written; none of it was visible in a diff.
      #
      # Self-tested first, like the guards above: this one's YAML parser is
      # hand-rolled (builtins only, no new dependency), so "the guard still
      # understands the file it reads" is itself part of what needs asserting.
      - name: Self-test the path-filter guard
        run: node .github/scripts/check-path-filters.test.mjs

      - name: CI path filters cover every declared dependency
        run: node .github/scripts/check-path-filters.mjs

      # #565: a check whose behaviour branches on a PR label is exercised only
      # on PRs pushed to at least twice — a PR is CREATED by one API call and
      # LABELLED by a separate one, so the `opened` run is dispatched before the
      # label exists (PR #555: run created 16:10:42Z, label applied 16:10:43Z).
      # The population of such checks was unknown, and an enumeration living in
      # an issue comment is not one: nothing reads it, so it goes stale silently.
      #
      # The registry is committed and this guard compares it against the tree in
      # two directions, which are NOT the same strength. REGISTRY -> TREE is
      # exhaustive, and it is the one that decays: check-path-filters promises in
      # prose that lane-check.yml "will refuse it", and DELETING that workflow —
      # or typoing `ci:cheap` inside it — used to leave every suite green while
      # the promise became false. Prose asserting external state with nothing
      # noticing when it diverges is the #535 class, and #565's own fix
      # reproduced it.
      #
      # TREE -> REGISTRY is BEST-EFFORT: it finds undeclared sites only where it
      # looks and only in the shapes it recognises. The guard's own header states
      # that reach and #593 measures it — read those rather than this comment.
      # Directions are NAMED here, not numbered: an ordinal silently inverts when
      # the list it indexes is reordered, which is #602.
      #
      # Self-tested first, like every guard here, and here for a specific reason:
      # its detection predicates DECIDE the population, so a false negative
      # silently empties the registry's meaning rather than failing loudly.
      - name: Self-test the label-dependence registry guard
        run: node .github/scripts/check-label-dependence.test.mjs

      - name: Label-dependent checks are declared, and the declarations hold
        run: node .github/scripts/check-label-dependence.mjs .

      # #601: version-bearing literals in published source. `VERSION = '0.1.0'`
      # shipped from a 0.1.1 package, and the v0.1.2 release hand-corrected five
      # of them where FOUR were found by searching rather than by enumeration —
      # a hand-maintained set with no member list anyone can check against.
      #
      # Self-tested first, like every guard here, and for the same reason as the
      # one above: its discovery pattern DECIDES which literals are candidates,
      # so a false negative quietly shrinks the registry's meaning instead of
      # failing loudly. The self-test pins that pattern's known blind spots as
      # executable assertions, so widening it reddens there first.
      - name: Self-test the version-literal registry guard
        run: node .github/scripts/check-version-literals.test.mjs

      - name: Version literals match the canonical source each declares
        run: node .github/scripts/check-version-literals.mjs .

      # PART A ONLY (#535). Declaration integrity: every registered site carries
      # a well-formed block, drawn from a closed vocabulary, with each property
      # tagged as the vocabulary classifies it. Bidirectional — a registered
      # file without a block fails, and a block in an unregistered file fails.
      #
      # OFFLINE BY CONSTRUCTION, which is why it can block a PR. The live
      # comparison is Part B and runs on a SCHEDULE, in reliability-nightly.yml,
      # deliberately NOT here: a GitHub API outage must not redden every PR with
      # a red nobody can clear. Do not "helpfully" add --live to this step.
      - name: Self-test the platform-claim guard
        run: node .github/scripts/check-platform-claims.test.mjs

      - name: Platform-claim declarations are well-formed
        run: node .github/scripts/check-platform-claims.mjs .

      # #599's reconciler, split the same way and for the same reason: this
      # self-test is OFFLINE BY CONSTRUCTION — every arm drives an injected
      # `readState`, so it never touches the network and can block a PR. The
      # live comparison runs on a SCHEDULE in reliability-nightly.yml. Do not
      # add --live here; a registry outage must not redden every PR.
      #
      # What it pins is that the reconciler goes RED — in BOTH directions, and
      # that a baselined pair does not suppress a new one. A reconciler never
      # shown failing is the same class of defect it exists to catch.
      - name: Self-test the release/registry reconciler
        run: node .github/scripts/check-release-registry-reconcile.test.mjs

      # #280: the Actions budget is exhausted, so a job on a GitHub-hosted
      # runner is refused at "Set up job" with an EMPTY LOG — no error, nothing
      # naming the cause. That shape cost a full investigation cycle on #278
      # before the answer turned out to be billing rather than code. PR #279
      # moved all jobs to the self-hosted pool; nothing stopped the next edit
      # putting `ubuntu-latest` back, and a NEW workflow file is the likelier
      # route than an edit to an existing one.
      #
      # Self-tested first, like the path-filter guard above, and for the same
      # reason: the YAML parser is hand-rolled, and the form it must not miss is
      # the bare string `runs-on: ubuntu-latest` — simultaneously the likeliest
      # reintroduction and the one a list-only parser passes in silence.
      - name: Self-test the runner guard
        run: node .github/scripts/check-runners.test.mjs

      - name: Every workflow job runs on the self-hosted pool
        run: node .github/scripts/check-runners.mjs

      # #687: dropping `push: main` above made reliability-nightly.yml's
      # `integrated-tree` job the SOLE proof for the tree main actually has. A
      # runner that reported success for suites it never executed would reopen
      # that gap and look green doing it — and unlike a PR check, nothing else
      # is watching a nightly.
      #
      # Self-tested first, like every guard here. The self-test is what shows
      # all three verdicts are reachable — pass, real failure, and cannot-run —
      # and it asserts STRUCTURALLY, against the runner's own source, that the
      # runner never reaches the path filters. That is the ADR-024 trap the
      # design turns on: a nightly reusing the `changes` job computes a diff
      # against nothing and reports green having run zero suites.
      #
      # Its production run is in reliability-nightly.yml, on the schedule; only
      # the self-test belongs on the pull-request path.
      - name: Self-test the nightly integrated-tree runner
        run: node .github/scripts/nightly-integrated-tree.test.mjs

      # #128: merge=union protects the MERGE. Nothing protects a hand-edit, a
      # whole-file restore, or a conflict resolved by taking one side — and an
      # append-only log has no append-only assertion, so a dropped row is
      # invisible once the branch is gone. The diff against the base is the only
      # moment both states still exist.
      - name: Append-only audit logs lose no rows
        run: node .github/scripts/check-audit-append-only.mjs

      # #276: the Factor 2 concealment allowlist decides which
      # instruction-shaped messages an agent may treat as routine. It is a
      # security control in an unprotected path, so the structural rule is that
      # a template cannot exist unless a real captured message matches it —
      # widening the allowlist then requires planting evidence a reviewer can
      # read, rather than editing one line of TOML.
      #
      # Self-tested first, like the guards above: this one's TOML reader is a
      # hand-rolled strict subset (builtins only, no new dependency on the path
      # that parses a security allowlist), so "the guard still understands the
      # file it reads" is itself part of what needs asserting.
      - name: Self-test the concealment-allowlist guard
        run: node .github/scripts/check-concealment-templates.test.mjs

      - name: Concealment allowlist is valid and evidence-bound
        run: node .github/scripts/check-concealment-templates.mjs .

      # #388: the doctrine states an invariant over capture rows —
      # factor_1 "unverifiable" implies classification "anomalous" — and named
      # a checker enforcing it that did not exist in this repository. The
      # invariant held by discipline alone, which is the shape the corpus
      # exists to catch, one level up.
      #
      # Self-tested first, like every guard above, and here the reason is
      # sharper than usual: the real corpus is currently CLEAN, so a validator
      # that only ever ran against it would pass for the same reason an empty
      # scan passes. The self-test is what shows each condition can fail.
      #
      # The base ref is passed so the diff-scoped conditions can run. A few
      # checks apply only to rows this change ADDS, because a row is judged
      # against the allowlist of its own moment — of 43 inverse-shaped rows in
      # the corpus, 42 predate T1C's merge and were correctly anomalous when
      # written. This job already checks out with fetch-depth: 0 for the
      # append-only guard, so the base is present. Without it the guard exits
      # 2 — CANNOT CHECK — never 0.
      - name: Self-test the capture-schema validator
        run: node .github/scripts/check-concealment-captures.test.mjs

      - name: Concealment captures satisfy their schema and stated invariant
        run: node .github/scripts/check-concealment-captures.mjs . "origin/${{ github.base_ref || github.event.repository.default_branch }}"

      # #431/#455: this guard ran here for months with no self-test at all, so
      # none of its three error paths was ever executed. Its own subject is
      # tests that cannot fail — a guard nothing can redden is the same claim
      # one level up. Self-tested first, like the guards below it.
      - name: Self-test the placeholder-test guard
        run: node .github/scripts/check-placeholder-tests.test.mjs

      - name: No placeholder or assertion-free tests
        run: node .github/scripts/check-placeholder-tests.mjs

      # #227: the harness writes .operum-stash-recovery into the repo root.
      # Untracked it makes the worktree dirty, so git_merge refuses a
      # fast-forward — and the agent/* home branches exist only to fast-forward
      # onto main. The failure is SELF-SEALING: a branch pinned at a commit
      # older than the .gitignore entry does not contain the entry, so it cannot
      # fast-forward to acquire it. Observed 2026-08-25, where agent/engineer
      # sat at ea961ea across three merged PRs and could not heal itself.
      - name: Self-test the runtime-marker ignore guard
        run: node .github/scripts/check-runtime-marker-ignored.test.mjs

      - name: Agent-runtime markers stay ignored by git
        run: node .github/scripts/check-runtime-marker-ignored.mjs .

      # #431/#455: self-tested first. Half this guard's value is in the false
      # positives it must NOT raise — the allowlist and the type-only carve-out
      # — and a guard that fails on correct code is one someone switches off.
      - name: Self-test the network-import guard
        run: node .github/scripts/check-network-imports.test.mjs

      # #26: docs/telemetry-policy.md promises no outbound call unless the
      # adopter configured one. Reads source only, so it runs before the build.
      - name: No network access outside the allowlist
        run: node .github/scripts/check-network-imports.mjs

      # #188: a broken relative link is invisible in review — the diff shows a
      # plausible path, and confirming it means leaving the diff. Two ad-hoc
      # sweeps found eight on main, one of which had survived since 2026-08-21
      # and every review since; human review caught none of them.
      #
      # Self-tested first, for the same reason as the guards below it: a guard
      # that silently matches nothing is indistinguishable in a CI log from one
      # that works. The self-test also pins the two false-positive shapes this
      # repository actually contains — template content in a ```markdown fence,
      # and TypeScript that parses as link syntax.
      - name: Self-test the markdown link guard
        run: node .github/scripts/check-markdown-links.test.mjs

      # #232: also validates ANCHORS now, not just files. A link whose file
      # exists but whose heading does not is the case a file-existence check
      # cannot see — the path resolves, so it reads as correct in review, and
      # the reader still lands at the top of the document.
      - name: No broken markdown links or anchors
        run: node .github/scripts/check-markdown-links.mjs .

      # #119: nothing else in CI reads source at the byte level, so a NUL byte
      # passes tsc, jest and every guard above it.
      #
      # #121: --require-roots because HERE the tree really is the repository, so
      # a declared scan root that has gone missing means coverage was lost —
      # not that someone pointed the guard at a fixture.
      # #431/#455: self-tested first. This guard is the ONLY thing in CI reading
      # bytes, so a silent failure here has no second line of defence — every
      # other check passes with a NUL present, which is why it exists.
      - name: Self-test the NUL-byte guard
        run: node .github/scripts/check-nul-bytes.test.mjs

      - name: No NUL bytes in source
        run: node .github/scripts/check-nul-bytes.mjs . --require-roots

      # #324: self-tested first, and the self-test is the point rather than
      # ceremony. This guard's whole value is that it reports EVERY drifted
      # artifact in one run; a version that short-circuits on the first finding
      # would still look correct in a green log, and would silently rebuild the
      # two-round-trip sequencing the guard exists to remove. The self-test
      # asserts the later runners were INVOKED, which output alone cannot show.
      - name: Self-test the workspace-artifact guard
        run: node .github/scripts/check-workspace-artifacts.test.mjs

      # #324: lockfile drift and NOTICE staleness are both already caught in CI
      # — but in SEQUENCE, by different jobs, so one change cost two red runs.
      # `npm ci` dies before the NOTICE check can run, which is why fixing the
      # lockfile did not cause a new failure, it made an existing one reachable.
      # Running here collapses that to one round-trip. Eliminating it needs the
      # check to run pre-push, which nothing in this repo can enforce.
      #
      # node_modules is present in this job (npm ci above), so the licence item
      # genuinely runs here rather than reporting "could not check".
      - name: Workspace artifacts are up to date
        run: node .github/scripts/check-workspace-artifacts.mjs .

      # #431/#456: self-tested first. Three of this guard's four failure sites
      # are exit(2) — cannot-check — and nothing observed any of them. The
      # sharpest is an empty denylist, which matches no label and so reports
      # "0 violations" on every metric: a green result meaning the opposite of
      # what a reader assumes.
      - name: Self-test the metric-cardinality guard
        run: node .github/scripts/check-metric-cardinality.test.mjs

      # #39 / §9.2: an unbounded metric label creates one time series per
      # distinct value. Parses source rather than importing dist, so it still
      # runs when the build is broken — which is exactly when a bad label is
      # most likely to be sitting in the tree.
      - name: No high-cardinality metric labels
        run: node .github/scripts/check-metric-cardinality.mjs

      # #63: a dashboard querying a metric we do not emit renders an EMPTY
      # panel, not an error — indistinguishable from a metric that is
      # legitimately at zero. The drift is therefore invisible until an
      # incident, which is exactly when the panel was supposed to earn its
      # keep. Self-tested first for the same reason as the guards above: a
      # guard that passes everything looks identical in a CI log to one that
      # works.
      # #156: four separate issues each rediscovered that a name in a doc had
      # never existed in the code, paying the same "find what was actually
      # meant" cost every time. Prose drifts quietly because nothing compiles
      # it — a wrong type in a ```typescript fence looks exactly as
      # authoritative as a right one. Self-tested first: half this guard's
      # value is in the false positives it must NOT raise, and a guard that
      # fails on correct documentation is a guard someone switches off.
      - name: Self-test the documentation type guard
        run: node .github/scripts/check-doc-types.test.mjs

      - name: Documented types exist in the code
        run: node .github/scripts/check-doc-types.mjs

      - name: Self-test the dashboard metric guard
        run: node .github/scripts/check-dashboard-metrics.test.mjs

      - name: Dashboards reference only metrics we emit
        run: node .github/scripts/check-dashboard-metrics.mjs

      # #110: the coverage signal decides whether a diff was tested at all, so it
      # is exactly the kind of logic that must not be trusted unverified. The
      # self-test drives every refusal branch and, critically, checks the new
      # signal against the 13 wrapper jobs it replaced on every reachable
      # combination — the contract this collapse had to preserve. It also asserts
      # every path-filtered test job is wired into the aggregate's `needs`, since
      # a package omitted from that list would silently never be required.
      - name: Self-test the coverage signal
        run: node .github/scripts/ci-coverage-status.test.mjs

      # Needs dist/ — packages resolve each other through their built entry points.
      - run: npm run build

      # #61 / §17 criterion 11. Runs AFTER the build because half of it scans
      # emitted .d.ts files for SDK types reaching the public surface — the leak
      # that is invisible in source. Without dist/ it exits 2 ("did not run")
      # rather than passing, so a missing build cannot look like a clean result.
      - name: Self-test the SDK boundary guard
        run: node .github/scripts/check-sdk-boundary.test.mjs

      - name: MCP SDK stays behind the transport boundary
        run: node .github/scripts/check-sdk-boundary.mjs

      # #371: the drill was the only script wired here WITHOUT a sibling
      # self-test, and that gap is why its spawn-failure routing went unnoticed.
      # A build that never STARTED returns status null, which `status === 0`
      # reads as false — so it fell through to interpretation, found no failing
      # packages, and reported PASS with an empty blast radius from a compiler
      # that never ran. Self-tested first, like every other guard here.
      - name: Self-test the SDK-upgrade drill
        run: node .github/scripts/sdk-upgrade-drill.test.mjs

      # The criterion is not "nothing imports it" but "an SDK change costs
      # nothing outside the transport". Only breaking one and looking proves
      # that, so the drill does exactly that and restores the file afterwards.
      - name: Fake-SDK-upgrade drill
        run: node .github/scripts/sdk-upgrade-drill.mjs

      # #583: Apache-2.0 §4(a) and §4(d) are satisfied by the PUBLISHED
      # TARBALL, not by the source tree. npm ships only what `files` names plus
      # a fixed always-included list — package.json, README, LICENSE/LICENCE,
      # "main", "bin" — and NOTICE is NOT on it. So a NOTICE sitting in the
      # package directory was excluded from every tarball while the tree looked
      # correct, which is how this shipped: docs/releasing.md's rehearsal
      # criterion passed, and a human reading a rendered npm page found it.
      #
      # The guard therefore PACKS. Its first version called fs.existsSync() on
      # the directory and exited 0 green in exactly the broken state — a green
      # check asserting compliance that did not hold, which is worse than no
      # check. Directory presence is not tarball presence.
      #
      # Self-tested first, like every guard here, and here the cannot-check arm
      # is the one that matters: if npm is unavailable or pack fails, it exits 2
      # and NEVER 0. "I could not check" is not "it passed" (#281). Unlike the
      # networked Part B in reliability-nightly.yml, a cannot-check here may
      # block a PR — there is no upstream outage to absorb, because npm packs
      # from the local tree.
      #
      # RUNS AFTER `npm run build` above, deliberately: pack reports dist/ only
      # once the package is built, and an unbuilt package is reported
      # cannot-check rather than passed.
      - name: Self-test the tarball compliance guard
        run: node .github/scripts/check-tarball-compliance.test.mjs

      - name: Published tarballs carry README, LICENSE and NOTICE
        run: node .github/scripts/check-tarball-compliance.mjs .

      # #598: the README's imports resolved for three rounds of fixes and for no
      # reader. The root package is named `@askturret/mcp` and declares
      # `exports`, so every specifier resolved here through package
      # SELF-REFERENCE while `@askturret/mcp` returned 404 on npm. #41 round 2,
      # #41 round 3 and #149 were each found, each fixed, and each verified in
      # the one environment where the package need not exist — #149's acceptance
      # even demanded "real import resolution", and was met honestly.
      #
      # So this guard does not run in the repository. It packs, extracts into a
      # temp directory that node's upward node_modules walk cannot escape into
      # this workspace, and executes each import statement there. It also probes
      # a package that cannot exist and refuses to report a pass if that
      # resolves — a clean room that is not clean would make every green
      # meaningless, which is the failure being corrected.
      #
      # RUNS AFTER `npm run build` above, for the same reason as the guard
      # above it: an unbuilt package packs without dist/ and is reported
      # cannot-check, never passed.
      - name: Self-test the README imports guard
        run: node .github/scripts/check-readme-imports.test.mjs

      - name: README imports work for a reader, not just in this repo
        run: node .github/scripts/check-readme-imports.mjs .

      # #62: docs/migrations/README.md is GENERATED from the migration registry.
      # A migration added without regenerating it would ship an index that
      # silently omits it — the same failure docs/adapters.md is generated to
      # avoid. Compares rather than rewrites, so CI reports instead of drifting.
      - name: Migration index is up to date
        run: |
          node packages/cli/dist/commands/migrate/generate-docs.js /tmp/migrations.md
          diff -u docs/migrations/README.md /tmp/migrations.md

      # Self-tested first, like every guard above (#531). This one had NO
      # self-test at all until now: the #431/#443 partition assigned it to #443
      # "including writing their self-tests", #443 closed via PR #507, and that
      # PR never touched this script — an omission rather than a descope. It was
      # the entire remaining unreachable set for the mutation audit, so this
      # wiring is what clears the #431 precondition.
      - name: Self-test the test-execution guard
        run: node .github/scripts/check-test-execution.test.mjs

      - name: Every package actually executes its tests
        run: node .github/scripts/check-test-execution.mjs

      # Both plugin examples are `testsNotRequired`, which is correct — they are
      # runnable demos, not libraries. But plugin-otel-exporter's own manifest
      # names the hazard that creates: "an example nothing builds or tests rots,
      # and a rotted reference is worse than none because authors copy it."
      #
      # So they are EXECUTED here rather than merely built. Both exit non-zero
      # on failure, and plugin-source compiles its operations through the real
      # compiler — so a broken plugin seam fails this step instead of printing
      # something plausible (#270).
      - name: Plugin examples run
        run: |
          node examples/plugin-otel-exporter/index.mjs
          node examples/plugin-source/index.mjs

      # Same class as the step above — a command that reports success for work
      # it did not do. Self-tested first, for the reason stated on every other
      # guard here: a checker that cannot fail is worse than no checker (#207).
      - name: Self-test the jest-flag-forwarding guard
        run: node .github/scripts/check-jest-flag-forwarding.test.mjs

      - name: No npm test invocation drops a jest flag
        run: node .github/scripts/check-jest-flag-forwarding.mjs .

      # A cited ADR that was never written reads as a recorded rationale and is
      # not one. Fourteen numbers dangled across seventy comments before #223
      # backfilled them; this is what stops it recurring.
      - name: Self-test the ADR-citation guard
        run: node .github/scripts/check-adr-citations.test.mjs

      - name: Every cited ADR resolves to a file
        run: node .github/scripts/check-adr-citations.mjs .

      # #612: docs/compatibility.{md,json} published `@modelcontextprotocol/sdk`
      # as ^0.5.0 / Supported while the root and packages/transports both
      # declared ^1.24.0 — because ^0.5.0 is the range excluded for
      # GHSA-w48q-cv73-mx4w (#140). A security-relevant row in the most
      # consumer-facing versioned document in this repository, contradicting the
      # code, with nothing able to notice it.
      #
      # This RE-DERIVES the contract's machine-comparable values from the code
      # on every run. That is the design, not an implementation detail: a
      # comparison that recomputes is TIME-INDIFFERENT, so one assertion covers
      # both a row that was wrong when written and one that decayed later, and
      # no separate decay watcher is needed.
      #
      # STEPS IN THIS EXISTING JOB, deliberately not a new job. There is ONE
      # self-hosted runner and CI is strictly serial, so a new job is a
      # permanent tax on the critical path — the same reasoning
      # supply-chain.yml:19-23 already records. This guard uses only Node
      # builtins, reads four files and needs no build.
      - name: Self-test the compatibility-contract watcher
        run: node .github/scripts/check-compatibility-contract.test.mjs

      - name: The compatibility contract still matches the code
        run: node .github/scripts/check-compatibility-contract.mjs .

      # #434 condition 1. Until this step existed, the mutation audit and its
      # self-test sat in `WIRING_EXEMPT` and the audit's own assertions ran
      # NOWHERE automated — the instrument that measures whether every other
      # guard has a witness was itself unverified by anything except the QA pass
      # at the SHA that introduced it.
      #
      # Self-test first, like every other guard here.
      - name: Self-test the mutation audit
        run: node .github/scripts/check-mutation-audit.test.mjs

      # The audit itself, REPORT-ONLY: stage 1 fails on its own integrity and
      # never on finding unwitnessed sites, so this step does not gate on
      # coverage. Going fail-closed is stage 2 (#434 conditions 2-6), and the
      # #431 ruling holds it back until no script lacks a witnessed failure
      # path.
      #
      # IT IS THE SLOWEST STEP IN THIS JOB — measured at 322s locally at 151
      # sites, of which ~113s is its own self-test running ten times, because
      # the audit is in its own target list (#437). That cost is now recurring
      # rather than local, and it is worth knowing before anyone tries to
      # reclaim it: the per-site `yield` measures ~3ms across all sites and is
      # what makes the tool cancellable. Removing it buys nothing and
      # reintroduces the regression #435 fixed. The real lever, if this ever
      # needs to be cheaper, is `check-mutation-audit.test.mjs` — every second
      # added there is charged about ten times.
      - name: Mutation audit (report-only)
        run: node .github/scripts/check-mutation-audit.mjs .

      # #65 / §17: Architectural readiness gate for 1.0.
      # Verifies that all 12 readiness criteria are met and reference passing tests.
      #
      # COMMIT-TIME ONLY (#233). This comment used to end "A tag matching v1.0.*
      # is refused if any row is red" — which was never true here: this workflow
      # triggers on pull_request only (it also ran on push to main until #687
      # change 3), so it cannot see a tag at all.
      # docs/readiness.md carried the same false claim and was corrected in the
      # same change. The tag-time gate is #269.
      #
      # The correction itself then went stale (#633). It used to add "and no
      # workflow in the repo has a tag trigger at all", which stopped being true
      # when tag-readiness-advisory.yml landed with `push: tags: ['v*']`. That
      # workflow is ADVISORY — it reports the matrix on a tag and refuses
      # nothing — so the point above is unchanged, but the supporting claim was
      # false and is removed rather than reworded around.
      #
      # Worth keeping the correction rather than just deleting the sentence: a
      # grep for "tag" in this directory used to find only that comment, which
      # read as evidence the gate existed.
      # Both steps below need `-w <pkg>` AND `--` (#207). Without `--`, npm eats
      # the flag as an unknown CLI config and runs the ENTIRE workspace suite —
      # so these two steps were running everything, twice, while their names
      # claimed to verify one criterion each. Without `-w`, `--` forwards the
      # flag to every workspace and jest exits 1 in each one the pattern misses.
      # `check-jest-flag-forwarding.mjs` fails the build if either form returns.
      - name: Policy parity test (criterion #4)
        run: npm test -w packages/core -- --testPathPattern="discovery-invocation-parity"

      - name: Idempotent+retryable fuzz test (criterion #6)
        run: npm test -w packages/core -- --testPathPattern="idempotent-retryable-fuzz"

      # The evaluator decides whether a 1.0 release publishes, so verify it
      # before trusting its verdict — same reasoning as check-licenses.test.mjs.
      - name: Self-test the readiness matrix gate
        run: node .github/scripts/check-readiness-matrix.test.mjs

      # The evaluator being correct is a different question from anything
      # consulting it. The release gate is one word in a `needs:` list, and the
      # release path cannot run on a PR — so the wiring is asserted by reading
      # the workflows here, where it runs on every change.
      - name: Release gate is wired to the evaluator
        run: node .github/scripts/check-release-gate-wiring.test.mjs

      # Extracted to a script by #269 because it now has two callers: this
      # commit-time gate and the release-time gate in supply-chain.yml, which
      # `publish` depends on. One implementation is what keeps them from
      # drifting apart. The parsing comments — numbered rows only, and exact
      # equality rather than '-lt' — moved with it.
      - name: Readiness matrix is current and all criteria met
        run: node .github/scripts/check-readiness-matrix.mjs
