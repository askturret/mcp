# TEMPORARY — measurement instrument for #784. Removed before this PR is ready.
#
# The question #784 turns on is a FACT nobody has measured: what can the
# scheduled job's OWN credential read? Every prior answer used an
# unauthenticated read as a proxy for "holds no admin", which is a different
# claim. This exercises `secrets.GITHUB_TOKEN` — the same credential the
# `platform-claims` job in reliability-nightly.yml passes to the guard.
#
# It probes BOTH properties in one run, because QA's stated limit applies to
# both `organisation_plan` and `dependabot_security_updates`.
name: tmp probe 784

on:
  push:
    branches: [fix/issue-784-organisation-plan-classification]

jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, askturret]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: What can the Actions token actually read
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node -e '
          const token = process.env.GITHUB_TOKEN;
          const headers = {
            "user-agent": "probe-784",
            accept: "application/vnd.github+json",
            authorization: `Bearer ${token}`,
          };
          const get = async (url) => {
            const r = await fetch(url, { headers });
            return { status: r.status, ok: r.ok, body: r.ok ? await r.json() : await r.text() };
          };
          (async () => {
            const org = await get("https://api.github.com/orgs/askturret");
            console.log("PROBE org status      :", org.status);
            if (org.ok) {
              console.log("PROBE org keys        :", Object.keys(org.body).length);
              console.log("PROBE org has plan    :", Object.prototype.hasOwnProperty.call(org.body, "plan"));
              console.log("PROBE org plan.name   :", org.body.plan && org.body.plan.name);
            } else {
              console.log("PROBE org error       :", String(org.body).slice(0, 200));
            }

            const repo = await get("https://api.github.com/repos/askturret/mcp");
            console.log("PROBE repo status     :", repo.status);
            if (repo.ok) {
              console.log("PROBE repo visibility :", repo.body.visibility);
              console.log("PROBE repo has s_a    :", Object.prototype.hasOwnProperty.call(repo.body, "security_and_analysis"));
              console.log("PROBE repo dsu.status :", repo.body.security_and_analysis
                && repo.body.security_and_analysis.dependabot_security_updates
                && repo.body.security_and_analysis.dependabot_security_updates.status);
            }

            const asf = await get("https://api.github.com/repos/askturret/mcp/automated-security-fixes");
            console.log("PROBE asf status      :", asf.status);
          })();
          '
