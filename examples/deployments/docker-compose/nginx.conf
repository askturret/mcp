# Minimal round-robin LB for the reference deployment (#63, §11.2).

events {}

http {
  upstream mcp {
    server mcp-a:7000;
    server mcp-b:7000;
  }

  server {
    listen 7000;

    location / {
      proxy_pass http://mcp;
      proxy_http_version 1.1;

      # MCP responses can stream. Buffering them would hold a complete response
      # in nginx before the client sees any of it, which converts a streaming
      # transport into a batch one without any error to say so.
      proxy_buffering off;

      # Must exceed the longest deadline the runtime is configured to allow, or
      # the LB severs calls the application was still legitimately working on —
      # and the client sees a 504 rather than the typed timeout error the
      # runtime would have returned.
      proxy_read_timeout 120s;

      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
