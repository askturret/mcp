openapi: 3.0.0
info:
  title: Petstore API
  version: 1.0.0
  description: A simple pet store API for demonstration purposes

servers:
  - url: https://petstore.example.com/api/v1

# WHERE MCP METADATA GOES — read this before adding an `x-mcp` key to ANY
# operation below (#764).
#
# It goes in a NESTED `x-mcp:` object (effects, annotations). The OpenAPI source
# extracts `operation['x-mcp']` and nothing else, so a FLAT `x-mcp-*` key is not
# read by discovery at all — silently ignored rather than rejected, which is what
# makes the mistake attractive. `docs/overlays.md` has where it sits in the
# precedence chain (level 3).
#
# THIS SITS ABOVE `paths:` RATHER THAN BESIDE ONE OPERATION. It was written at
# `listPets`, because that is where #736 removed a flat `x-mcp-input-schema` —
# so a reader adding a key at `getPetById` never met it, which is the exact
# reader it was written for. Hoisting reaches both operations, and any added
# later, with ONE copy. Repeating it per operation would be a second
# hand-maintained copy of one claim, the arrangement that goes stale (#775).
#
# ONE CONTRADICTION, RECORDED RATHER THAN SMOOTHED OVER (#764). `turret doctor`
# reads a FLAT `x-mcp-effects` off the operation object and warns when a mutating
# operation lacks one, suggesting "Add x-mcp-effects to operation object" — the
# shape discovery ignores. The tree ships both instructions. An earlier version
# of this comment said flat keys are read by "nothing", which is false of
# `doctor`. Until that is settled, prefer nested `x-mcp:` here: it is the form
# the compiled tool actually receives.
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      description: Returns a list of all pets in the store
      parameters:
        - name: limit
          in: query
          description: Maximum number of pets to return
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
      # This operation needs no `x-mcp:` at all: its input schema is derived
      # from the `parameters` above. #736 removed a flat `x-mcp-input-schema`
      # here that duplicated `limit`. The general rule is above `paths:`.
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: object
                properties:
                  pets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Pet'
                  total:
                    type: integer

  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      description: Returns a single pet
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of pet to return
          schema:
            type: string
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found

components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique identifier
        name:
          type: string
          description: Pet name
        species:
          type: string
          description: Pet species (e.g., dog, cat, bird)
        age:
          type: integer
          description: Pet age in years
